[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-car-dashcam"
version = "0.1.0"
description = "Local dashcam object search demo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.10",
    "pillow>=10.4",
    "platformdirs>=4.3",
    "streamlit>=1.40",
    "ultralytics>=8.3",
]

[project.scripts]
roadlens = "app.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
